# Nemotron 3.5 Super VL (NVFP4) — NVIDIA Early Access (NDA, GA 2026-10-15).
# Remote shared vLLM served by the Platform team (sel2 `vllm` namespace); we never
# launch it ourselves, so there is no serve script and `--serve` must not be used.
# No audio encoder → audio goes in as a Whisper transcript (same cascade as Qwen3.8).
# Server constraints: no file:// media (→ base64 + transcode of >200MB files),
# per-request mm_processor_kwargs rejected (→ inference.strip_mm_kwargs).
# Sampling follows the official Nemotron 3 Super card (temperature 1.0 / top_p 0.95,
# think and no-think alike). temperature/max_tokens live in the benchmark config —
# measured with configs/nemotron_super_vl/bench_{nothink,think}.yaml.
# Measurement configs (no-think / think / Nemotron-ASR): configs/nemotron_super_vl/.
global:
  result_dir: ../../results
  request_timeout_s: 3600

models:
  - name: nemotron-3.5-super-vl-nvfp4
    served_model_name: nemotron-3.5-super-vl-nvfp4
    weight_path: /dev/null   # remote endpoint only — never --serve
    base_url: http://vllm-nemotron-3-5-super-vl-nvfp4.vllm:8000/v1
    inference:
      audio: asr_text
      transport: base64
      strip_mm_kwargs: true
    transcode:
      threshold_mb: 200
      cache_dir: /gpfs/public/artifacts/ail/nemotron-compare/cache/transcode
      preset: veryfast
      threads: 8
      ladder:
        - {max_height: 720, crf: 28}
        - {max_height: 480, crf: 30}
        - {max_height: 360, crf: 32}
    extra_body:
      top_p: 0.95
      chat_template_kwargs:
        enable_thinking: false   # set true for think (reasoning returns in message.reasoning)
    asr:
      strategy:
        name: faster_whisper
        model: Systran/faster-whisper-large-v3
        device: cuda
        device_index: 0
        compute_type: float16
        options:
          beam_size: 5
          vad_filter: true
          condition_on_previous_text: false
      cache_dir: /gpfs/public/artifacts/ail/omni-bench/cache/asr
      strict_cache: true
