# E0 ablation: Qwen3.8-27B with the audio modality removed entirely.
#
# Added back after E1's numbers undercut the assumption that dropping audio can
# only hurt: AV-SpeakerBench lost 4.72 points on Visual-centric, where audio is
# irrelevant, and OmniVideoBench *gained* 3.30 on Music, which ASR cannot
# describe. Both suggest the transcript's contribution may be small or negative
# in places, and E1 - E0 is the only way to measure it.
#
# Video-MME is not part of this: it is already audio_mode none at the benchmark
# level, so E0 and E1 send byte-identical inputs there.
global:
  result_dir: /gpfs/public/artifacts/ail/omni-bench/runs/results
  request_timeout_s: 1800

models:
  - name: qwen3.8-27b
    served_model_name: Qwen3.8-27B
    weight_path: /gpfs/public/artifacts/models/Qwen/Qwen3.8-27B/
    base_url: http://127.0.0.1:8001/v1
    audio_mode: none
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    vllm:
      host: 127.0.0.1
      port: 8001
      tensor_parallel_size: 1
      data_parallel_size: auto
      gpu_memory_utilization: 0.9
      extra_args:
        - --trust-remote-code
        - --allowed-local-media-path
        - /gpfs/public/datasets
