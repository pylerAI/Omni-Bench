# E0 baseline: Qwen3.8-27B with the audio modality removed entirely.
# Isolates how much the ASR channel contributes in the E1 run.
global:
  result_dir: ../../results
  request_timeout_s: 900

models:
  - name: qwen3.8-27b
    served_model_name: Qwen3.8-27B
    weight_path: /gpfs/public/artifacts/models/Qwen/Qwen3.8-27B/
    base_url: http://127.0.0.1:8000/v1
    audio_mode: none
    vllm:
      host: 127.0.0.1
      port: 8000
      tensor_parallel_size: 1
      data_parallel_size: auto
      gpu_memory_utilization: 0.9
      extra_args:
        - --trust-remote-code
        - --allowed-local-media-path
        - /gpfs/public/datasets
