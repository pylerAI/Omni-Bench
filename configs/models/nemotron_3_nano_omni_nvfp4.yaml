global:
  result_dir: ../../results
  request_timeout_s: 900

models:
  - name: nemotron-3-nano-omni-nvfp4
    served_model_name: Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
    weight_path: /gpfs/public/artifacts/models/nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4/
    base_url: http://127.0.0.1:8000/v1
    # Reasoning model: disable chain-of-thought so MCQ benchmarks answer directly.
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    vllm:
      host: 127.0.0.1
      port: 8000
      tensor_parallel_size: 1
      data_parallel_size: auto
      gpu_memory_utilization: 0.9
      extra_args:
        - --trust-remote-code
        - --moe-backend
        - triton
        - --no-enable-flashinfer-autotune
        - --allowed-local-media-path
        - /gpfs/public/datasets
