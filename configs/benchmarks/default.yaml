benchmarks:
  - name: av_speakerbench
    data_path: /gpfs/public/datasets/AV-SpeakerBench/
    split: test
    mode: av
    max_tokens: 8192
    temperature: 0

  - name: omnivideobench
    annotation_file: /gpfs/public/datasets/OmniVideoBench/data.parquet
    video_dir: /gpfs/public/datasets/OmniVideoBench
    max_tokens: 8192
    temperature: 0
    num_frames: 120
    max_workers: 2
    preprocess_workers: 4
    preprocess_cache_dir: /gpfs/public/datasets/OmniVideoBench/preprocess_cache

  - name: videomme
    annotation_file: /gpfs/public/datasets/Video-MME/output_test_template.json
    video_dir: /gpfs/public/datasets/Video-MME/videos
    max_tokens: 8192
    temperature: 0
    use_subtitles: false

  - name: omnidcbench
    data_path: /gpfs/public/datasets/OmniDCBench
    annotation_file: /gpfs/public/datasets/OmniDCBench/ours_gt_file.json
    video_dir: /gpfs/public/datasets/OmniDCBench/Video
    max_tokens: 8192
    temperature: 0
    max_frames: 160
    fps: 2.0
    max_pixels: 297920

  - name: worldsense
    data_path: /gpfs/public/datasets/WorldSense
    annotation_file: /gpfs/public/datasets/WorldSense/worldsense_qa.json
    video_dir: /gpfs/public/datasets/WorldSense/videos
    max_tokens: 8192
    temperature: 0
    num_frames: 8
