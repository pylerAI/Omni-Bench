benchmarks:
  - name: av_speakerbench
    data_path: /gpfs/public/datasets/AV-SpeakerBench/
    split: test
    mode: av
    max_tokens: 8192
    temperature: 0

  - name: omnivideobench
    annotation_file: /gpfs/public/datasets/OmniVideoBench/data.parquet
    video_dir: /gpfs/public/datasets/OmniVideoBench
    max_tokens: 1024
    temperature: 0.7
    do_sample: true
    fps: 2.0
    max_frames: 120
    max_workers: 2
    preprocess_workers: 4
    preprocess_cache_dir: /gpfs/public/datasets/OmniVideoBench/preprocess_cache

  - name: videomme
    annotation_file: /gpfs/public/datasets/Video-MME/videomme/test-00000-of-00001.parquet
    video_dir: /gpfs/public/datasets/Video-MME/data
    max_tokens: 8192
    temperature: 0
    use_subtitles: false
    # Frames are sampled client-side (the server ignores per-request video
    # sampling kwargs) and sent as images, like VLMEvalKit's Video-MME_64frame.
    max_frames: 64
    max_pixels: 602112   # 768*28*28 per-frame area cap (~192 tokens/frame)

  - name: omnidcbench
    data_path: /gpfs/public/datasets/OmniDCBench
    annotation_file: /gpfs/public/datasets/OmniDCBench/ours_gt_file.json
    video_dir: /gpfs/public/datasets/OmniDCBench/Video
    max_tokens: 16384
    temperature: 0
    max_frames: 160
    fps: 2.0
    max_pixels: 297920
    concurrency: 8
    max_workers: 4
    enable_sodam: false

  - name: worldsense
    data_path: /gpfs/public/datasets/WorldSense
    annotation_file: /gpfs/public/datasets/WorldSense/worldsense_qa.json
    video_dir: /gpfs/public/datasets/WorldSense/videos
    max_tokens: 8192
    temperature: 0
    num_frames: 8
