# Video-MME thinking · ASR 미주입(official 프로토콜)
# recommend config (Qwen 권장 샘플링 · inference.frames: server)
benchmark_config: bench_videomme_thinking.yaml   # paired benchmark config (CLI --benchmark-config overrides)
models:
- served_model_name: Qwen3.8-27B
  weight_path: /gpfs/public/artifacts/models/Qwen/Qwen3.8-27B/
  base_url: http://127.0.0.1:8001/v1
  inference:
    audio: none
    reasoning: think_tag   # local vLLM has no reasoning parser: answer follows </think> in content
  name: qwen3.8-27b-srv-think
  extra_body:
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    chat_template_kwargs:
      enable_thinking: true
